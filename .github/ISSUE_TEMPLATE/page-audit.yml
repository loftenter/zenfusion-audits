name: 📄 Page-Level Audit
description: Combined site audit + keyword SERP analysis for a specific page
labels: ["page-audit"]
body:
  - type: input
    id: page_url
    attributes:
      label: Page URL
      description: The specific page URL to audit
      placeholder: https://www.example.com/salt-free-water-softener
    validations:
      required: true
  - type: input
    id: keyword
    attributes:
      label: Keyword
      description: The target keyword for this page
      placeholder: salt free water softener
    validations:
      required: true
