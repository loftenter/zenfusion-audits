:root {

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}
h1 { font-size: 24px; margin-bottom: 4px; }
h2 { font-size: 16px; color: var(--muted); font-weight: 400; margin-bottom: 20px; }
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; text-align: center;
}
.stat-card .num { font-size: 32px; font-weight: 700; }
.stat-card .label { font-size: 11px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
.crit .num { color: var(--red); } .crit { border-top: 3px solid var(--red); }
.warn .num { color: var(--orange); } .warn { border-top: 3px solid var(--orange); }

.not .num { color: var(--gray); } .not { border-top: 3px solid var(--gray); }
.health-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; text-align: center; grid-column: span 4;
}
.health-card .score { font-size: 48px; font-weight: 700; color: var(--green); }
.health-card .label { font-size: 12px; color: #ffffff; opacity: 0.9; }
.cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.cat-tab {
  background: var(--card); border: 1px solid var(--border); color: #ffffff;
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  transition: all 0.2s;
}
.cat-tab:hover { border-color: var(--accent); color: var(--text); }
.cat-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.cat-tab .count { font-size: 10px; opacity: 0.7; margin-left: 4px; }
.issue-list { display: flex; flex-direction: column; gap: 8px; }
.issue-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
}
.issue-header {
  padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.issue-header:hover { background: rgba(255,255,255,0.03); }
.sev-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sev-Critical { background: var(--red); }
.sev-Warning { background: var(--orange); }
.sev-Opportunity { background: var(--blue); }
.sev-Notice { background: var(--gray); }
.issue-name { flex: 1; font-size: 14px; font-weight: 500; }
.issue-pages { font-size: 12px; color: #ffffff; opacity: 0.8; }
.issue-cat { font-size: 10px; color: #ffffff; background: rgba(255,255,255,0.1); opacity: 0.9; padding: 2px 8px; border-radius: 4px; }
.issue-detail {
  display: none; padding: 0 18px 14px 40px; border-top: 1px solid var(--border);
  margin-top: 0;
}
.issue-detail.show { display: block; padding-top: 14px; }
.fix-box {
  background: rgba(74,144,217,0.1); border-left: 3px solid var(--accent);
  padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; color: var(--text);
}
.fix-box .fix-label { font-size: 10px; color: #ffffff; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.url-list { max-height: 300px; overflow-y: auto; }
.url-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px;
}
.url-item:last-child { border-bottom: none; }
.url-item a { color: var(--accent); text-decoration: none; word-break: break-all; }
.url-item a:hover { text-decoration: underline; }
.url-item .status { font-size: 10px; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
.status-200 { background: rgba(39,174,96,0.2); color: var(--green); }
.status-301 { background: rgba(243,156,18,0.2); color: var(--orange); }
.status-404, .status-429, .status-4xx { background: rgba(231,76,60,0.2); color: var(--red); }
.url-item .weight { font-size: 10px; color: #ffffff; opacity: 0.7; flex-shrink: 0; min-width: 40px; text-align: right; }
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn {
  background: var(--card); border: 1px solid var(--border); color: #ffffff;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
}
.filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.search-box {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 6px; font-size: 13px; width: 100%; margin-bottom: 16px;
}
.search-box::placeholder { color: #ffffff; opacity: 0.5; }
.footer { text-align: center; padding: 20px 0; color: #ffffff; opacity: 0.6; font-size: 11px; }
.export-btn {
  background: var(--accent); color: white; border: none; padding: 8px 16px;
  border-radius: 6px; cursor: pointer; font-size: 12px; float: right;
}
.export-btn:hover { opacity: 0.9; }
@media (max-width: 768px) {
  .dashboard { grid-template-columns: repeat(2, 1fr); }
  .health-card { grid-column: span 2; }

let currentCategory = 'all';
let currentSeverity = 'all';
let searchTerm = '';

function renderDashboard() {
  const d = document.getElementById('dashboard');
  const t = DATA.totals;
  d.innerHTML = `
    <div class="stat-card health-card">
      <div class="score">${DATA.health}</div>
      <div class="label">SITE HEALTH SCORE / 100</div>
    </div>
    <div class="stat-card crit"><div class="num">${t.criticals}</div><div class="label">Criticals</div></div>
    <div class="stat-card warn"><div class="num">${t.warnings}</div><div class="label">Warnings</div></div>
    <div class="stat-card opp"><div class="num">${t.opportunities}</div><div class="label">Opportunities</div></div>
    <div class="stat-card not"><div class="num">${t.notices}</div><div class="label">Notices</div></div>
  `;
}

function renderCatTabs() {
  const tabs = document.getElementById('catTabs');
  let cats = [{key:'all', name:'All Categories', count: 0}];
  let totalCount = 0;
  for (const [cat, issues] of Object.entries(DATA.categories)) {
    const c = issues.reduce((s,i) => s + i.pages, 0);
    cats.push({key: cat, name: cat, count: c});
    totalCount += c;
  }
  cats[0].count = totalCount;
  cats.sort((a,b) => b.count - a.count);
  cats = cats.sort((a,b) => (a.key === 'all' ? -1 : b.count - a.count));
  tabs.innerHTML = cats.map(c =>
    `<div class="cat-tab ${c.key === currentCategory ? 'active' : ''}" onclick="selectCategory('${c.key}')">${c.name}<span class="count">${c.count}</span></div>`
  ).join('');
}

function selectCategory(cat) { currentCategory = cat; renderCatTabs(); renderIssues(); }
function selectSeverity(sev) {
  currentSeverity = sev;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.sev === sev));
  renderIssues();
}
document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => selectSeverity(b.dataset.sev)));

function renderIssues() {
  const list = document.getElementById('issueList');
  let allIssues = [];
  for (const [cat, issues] of Object.entries(DATA.categories)) {
    if (currentCategory !== 'all' && cat !== currentCategory) continue;
    for (const issue of issues) {
      if (currentSeverity !== 'all' && issue.severity !== currentSeverity) continue;
      if (searchTerm) {
        const s = searchTerm.toLowerCase();
        if (!issue.name.toLowerCase().includes(s) && !cat.toLowerCase().includes(s) &&
            !issue.affected.some(p => p.url.toLowerCase().includes(s))) continue;
      }
      allIssues.push({...issue, cat});
    }
  }
  allIssues.sort((a,b) => {
    const sevOrder = {Critical: 0, Warning: 1, Opportunity: 2, Notice: 3};
    return sevOrder[a.severity] - sevOrder[b.severity] || b.pages - a.pages;
  });

  list.innerHTML = allIssues.map((issue, i) => {
    const fix = DATA.fix_instructions[issue.name] || 'No fix instructions available yet.';
    const urls = issue.affected.slice(0, 50).map(p => `
      <div class="url-item">
        <span class="status status-${p.status}">${p.status}</span>
        <a href="${p.url}" target="_blank">${p.url}</a>
        <span class="weight">${p.weight}</span>
      </div>
    `).join('');
    const moreText = issue.pages > 50 ? `<div style="color:#ffffff;opacity:0.6;font-size:11px;padding:8px 0">+ ${issue.pages - 50} more affected pages...</div>` : '';
    return `
      <div class="issue-card">
        <div class="issue-header" onclick="toggleIssue(${i})">
          <div class="sev-dot sev-${issue.severity}"></div>
          <div class="issue-name">${issue.name}</div>
          <div class="issue-cat">${issue.cat}</div>
          <div class="issue-pages">${issue.pages} pages</div>
        </div>
        <div class="issue-detail" id="issue-${i}">
          <div class="fix-box">
            <div class="fix-label">How to Fix</div>
            ${fix}
          </div>
          <div class="url-list">${urls}${moreText}</div>
        </div>
      </div>
    `;
  }).join('');

  if (allIssues.length === 0) {
    list.innerHTML = '<div style="color:#ffffff;opacity:0.6;padding:20px;text-align:center">No issues match the current filter.</div>';
  }
}

function toggleIssue(i) {
  const el = document.getElementById('issue-' + i);
  el.classList.toggle('show');
}

function filterIssues() {
  searchTerm = document.getElementById('searchBox').value;
  renderIssues();
}

renderDashboard();
renderCatTabs();
renderIssues();
</script>
